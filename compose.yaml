services:
  app:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://falxter.co.jp}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      ASTRO_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
    ports: ["${APP_PORT:-4321}:4321"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/.wrangler/tmp:size=16m,mode=1777
      - /app/.wrangler/state:size=16m,mode=1777
      - /app/.astro:size=8m,mode=1777
      - /app/node_modules/.mf:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [frontend]
networks:
  frontend: {driver: bridge}
